name: Schedule Diagnostic
on:
  schedule:
    - cron: '35,40 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report scheduler event
        run: |
          date -u
          echo 'Scheduled diagnostic ran; no notification is sent.'
