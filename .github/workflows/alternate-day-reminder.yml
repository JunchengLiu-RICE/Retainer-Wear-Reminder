name: Alternate-day WeChat Reminder
# Set repository secret SERVERCHAN_ALTERNATE_KEY to the second SendKey.
# Scheduled runs are evaluated against the Beijing date, starting 2026-11-08.
# Manual runs are dry runs and do not send a message.
on:
  schedule:
    - cron: '10,20,30,40,50 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check date and send reminder
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_ALTERNATE_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request
          tz = dt.timezone(dt.timedelta(hours=8))
          now = dt.datetime.now(tz)
          start = dt.date(2026, 11, 8)
          days = (now.date() - start).days
          due = days >= 0 and days % 2 == 0
          print(f'Beijing date: {now.date()}; scheduled reminder day: {due}')
          key = os.environ.get('SERVERCHAN_KEY', '').strip()
          if not re.fullmatch(r'[A-Za-z0-9_-]+', key):
              sys.exit('Missing or invalid SERVERCHAN_ALTERNATE_KEY secret.')
          if os.environ.get('EVENT_NAME') == 'workflow_dispatch':
              print('Dry run: no notification sent.')
              sys.exit(0)
          if not due:
              print('Not a reminder day; skipping.')
              sys.exit(0)
          payload = urllib.parse.urlencode({
              'title': '保持器佩戴提醒 ' + now.strftime('%H:%M'),
              'desp': '晚上好，记得今晚佩戴保持器！'
          }).encode('utf-8')
          request = urllib.request.Request(
              f'https://sctapi.ftqq.com/{key}.send',
              data=payload,
              headers={'Content-Type': 'application/x-www-form-urlencoded'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  result = json.load(response)
          except Exception:
              sys.exit('ServerChan request failed. Check connectivity and credentials.')
          if result.get('code') != 0:
              sys.exit(f"ServerChan rejected the notification (code: {result.get('code')}).")
          print('ServerChan accepted the notification.')
          PY
